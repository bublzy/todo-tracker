name: YouTube stats

# Каждые 3 часа сохраняет снимок публичной статистики канала в youtube.json на ветке data.
# Страница трекера (вкладка «YouTube») рисует по нему отчёт.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Скрипт сборщика
        uses: actions/checkout@v5
        with:
          path: site
          sparse-checkout: .github/scripts

      - name: Ветка с данными
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Собрать статистику
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: UCovx5_eaInF8mZf9GaObQwA   # @nauka_segodnya
        run: node site/.github/scripts/youtube-stats.mjs data/youtube.json

      - name: Сохранить в ветку data
        working-directory: data
        run: |
          git config user.name "youtube-stats"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A youtube.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -q -m "youtube: снимок статистики"
          for i in 1 2 3 4; do
            git push -q origin HEAD:data && exit 0
            git pull -q --rebase origin data
          done
          exit 1
